<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecole+ Kenya — School Management & CBC Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-soft: #ccfbf1;
      --accent: #1d4ed8;
      --accent-soft: #dbeafe;
      --success: #15803d;
      --success-soft: #dcfce7;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --stamp-red: #dc2626;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    /* Login Screen */
    .login-shell {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 16px 20px;
      background:
        linear-gradient(180deg, rgba(241, 245, 249, 0.72) 0%, rgba(226, 232, 240, 0.66) 52%, rgba(219, 234, 254, 0.78) 100%),
        radial-gradient(circle at 15% 16%, rgba(37, 99, 235, 0.22), transparent 46%),
        radial-gradient(circle at 85% 20%, rgba(15, 118, 110, 0.20), transparent 46%),
        radial-gradient(circle at 50% 88%, rgba(30, 58, 138, 0.16), transparent 52%),
        linear-gradient(145deg, #cbd5e1 0%, #e2e8f0 45%, #bfdbfe 100%);
      overflow: hidden;
    }

    .login-backdrop-decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.75;
      background-image:
        linear-gradient(to right, rgba(100, 116, 139, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(100, 116, 139, 0.14) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 0;
    }

    .login-bg-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.26;
      filter: blur(2px) saturate(1.1);
      z-index: 0;
    }

    .login-header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 14px;
    }

    .login-brand-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .login-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .login-school-heading {
      margin: 22px 0 18px;
      font-size: 23px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .login-subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      font-weight: 500;
      color: #475569;
    }

    .login-school-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      color: #0f766e;
    }

    .login-subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 410px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 24px 24px 20px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }

    .login-input-group {
      display: flex;
      align-items: center;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
      margin-bottom: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .login-input-group:focus-within {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .login-input-prefix {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      border-right: 1px solid #e2e8f0;
      color: #475569;
      font-size: 15px;
      flex-shrink: 0;
    }

    .login-input-group input {
      flex: 1;
      border: none;
      outline: none;
      padding: 10px 12px;
      font-size: 14px;
      color: #0f172a;
      background: transparent;
      min-width: 0;
    }

    .login-eye-btn {
      border: none;
      background: transparent;
      color: #475569;
      padding: 0 12px;
      height: 42px;
      cursor: pointer;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .login-eye-btn:hover {
      color: #0f172a;
    }

    .login-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
      margin-bottom: 16px;
    }

    .login-submit-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.28);
    }

    .login-submit-btn:hover {
      background: linear-gradient(180deg, #1d4ed8 0%, #1e40af 100%);
    }

    .login-quick-links {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      flex-wrap: wrap;
    }

    .login-quick-link-btn {
      border: none;
      background: transparent;
      color: #1e3a8a;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 4px;
    }

    .login-quick-link-btn:hover {
      text-decoration: underline;
    }

    .login-footer {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 12px;
      color: #475569;
      margin-top: 14px;
    }

    /* App Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    .sidebar {
      width: 256px;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.2s ease, width 0.2s ease;
    }

    .sidebar-brand {
      padding: 18px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d9488, #1d4ed8);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
    }

    .sidebar-nav {
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      flex: 1;
    }

    .nav-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 10px 12px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
    }

    .nav-badge {
      background: #ef4444;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      font-size: 12px;
      color: #94a3b8;
    }

    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mobile-menu-btn {
      display: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .bell-wrap {
      position: relative;
    }

    .bell-btn {
      position: relative;
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--ink);
      border-radius: 9px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 16px;
    }

    .bell-count {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #dc2626;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      padding: 0 4px;
    }

    .bell-dropdown {
      position: absolute;
      right: 0;
      top: 44px;
      width: 340px;
      max-width: calc(100vw - 24px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
      z-index: 50;
      overflow: hidden;
    }

    .content-area {
      padding: 18px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .muted {
      color: var(--muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
      color: var(--ink);
    }

    .kpi-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: var(--surface-alt);
      border-color: #cbd5e1;
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: var(--primary-dark);
    }

    .btn.blue {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .btn.sm {
      padding: 5px 9px;
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      background: #e2e8f0;
      color: #334155;
    }

    .badge.ok {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge.bad {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .badge.info {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: var(--surface);
    }

    th, td {
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-alt);
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .field input, .field select, .field textarea {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--ink);
      background: #ffffff;
    }

    .field textarea {
      min-height: 70px;
      resize: vertical;
    }

    .subtabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .subtab-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: #334155;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .subtab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    /* Official Stamp with Red Date */
    .official-stamp {
      display: inline-block;
      border: 2.5px solid #1e3a8a;
      color: #1e3a8a;
      border-radius: 8px;
      padding: 7px 12px;
      text-align: center;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.92);
      transform: rotate(-2.5deg);
      line-height: 1.25;
      min-width: 185px;
    }

    .official-stamp .stamp-sub {
      font-size: 9.5px;
      color: #334155;
      font-weight: 700;
    }

    .official-stamp .stamp-office {
      font-size: 11px;
      color: #0f172a;
      margin: 2px 0;
    }

    .official-stamp .stamp-date-red {
      color: var(--stamp-red);
      font-size: 11px;
      font-weight: 800;
    }

    /* CBC Master Timetable Visuals */
    .cbc-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(90deg, #0f294a 0%, #1d4ed8 52%, #0f766e 100%);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .cbc-section-hdr {
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px 8px 0 0;
      letter-spacing: 0.02em;
    }

    .cbc-hdr-pre { background: #15803d; }
    .cbc-hdr-low { background: #1d4ed8; }
    .cbc-hdr-upp { background: #6d28d9; }

    .cbc-break-row td {
      background: #dcfce7 !important;
      font-weight: 700;
      color: #14532d;
    }

    .cbc-lunch-row td {
      background: #e0f2fe !important;
      font-weight: 700;
      color: #0c4a6e;
    }

    /* Weekly Lesson Plan Template */
    .wlp-sheet {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 18px;
    }

    .wlp-sched-table th {
      background: #c5e0b4;
      color: #0f172a;
      border: 1px solid #94a3b8;
    }

    .wlp-sched-table td {
      border: 1px solid #cbd5e1;
    }

    .wlp-sched-table td:first-child {
      background: #e2efda;
      font-weight: 700;
      width: 110px;
    }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 80;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 14px;
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .toast-host {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 95;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast-item {
      background: #0f172a;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
      max-width: 360px;
    }

    @media (max-width: 900px) {
      .grid-4, .grid-3, .grid-2 {
        grid-template-columns: 1fr;
      }

      .mobile-menu-btn {
        display: inline-flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 60;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }
    }

    @media print {
      .sidebar, .topbar, .no-print, .toast-host, .modal-backdrop {
        display: none !important;
      }
      body {
        background: #ffffff;
      }
      .content-area {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div id="modalBox" class="modal-box"></div>
  </div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'ecole_plus_kenya_portal_v2026_11_24';
    const STAMP_DATE = '24 Nov 2026';

    const ROLES = [
      'Admin',
      'Headteacher',
      'Academic Master',
      'Class Teacher',
      'Subject Teacher',
      'Accountant',
      'Parent'
    ];

    const ALL_PERMISSIONS = [
      'manage_users',
      'manage_settings',
      'manage_students',
      'manage_staff',
      'manage_fees',
      'manage_timetables',
      'manage_lesson_plans',
      'enter_scoresheets',
      'reconcile_marks',
      'consolidate_streams',
      'approve_reports',
      'download_reports',
      'send_chats'
    ];

    const STREAMS = [
      'PG East', 'PG West',
      'PP1 East', 'PP1 West',
      'PP2 East', 'PP2 West',

    function makeStaffUsername(fullName) {
      const parts = String(fullName || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return 'StaffUser';
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
      const firstInitial = parts[0].charAt(0).toUpperCase();
      const surname = parts[parts.length - 1];
      const cleanSurname = surname.charAt(0).toUpperCase() + surname.slice(1).toLowerCase();
      return firstInitial + cleanSurname;
    }

    function makeParentUsername(studentName) {
      return String(studentName || '').trim().replace(/[^a-zA-Z0-9]/g, '');

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const base = buildDefaultDB();
          return Object.assign({}, base, parsed, {
            signatures: Object.assign({}, base.signatures, parsed.signatures || {}),
            masterTimetable: Object.assign({}, base.masterTimetable, parsed.masterTimetable || {}),
            classTeacherMap: Object.assign({}, base.classTeacherMap, parsed.classTeacherMap || {})
          });
        }
      } catch (err) {
        // Fallback to default seed data if storage is unavailable
      }
      return buildDefaultDB();
    }

    function saveDB() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (err) {
        // Ignore storage quota issues
      }
      // Firebase sync is added below as a separate module so the rest of this
      // single-file application can continue using its existing JavaScript.
      if (typeof window.__ecoleFirebaseSave === 'function') {
        window.__ecoleFirebaseSave(db);
      }
    }

    window.__ecoleGetLocalData = () => db;
    window.__ecoleApplyFirebaseData = (cloudData) => {
      if (!cloudData || typeof cloudData !== 'object') return;
      const base = buildDefaultDB();
      db = Object.assign({}, base, cloudData, {
        signatures: Object.assign({}, base.signatures, cloudData.signatures || {}),
        masterTimetable: Object.assign({}, base.masterTimetable, cloudData.masterTimetable || {}),
        classTeacherMap: Object.assign({}, base.classTeacherMap, cloudData.classTeacherMap || {})
      });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (err) {}
      if (typeof render === 'function') render();
    };

          enabled: true,
          lockedUsername: true,
          permissions: [...ALL_PERMISSIONS]
        });
        changed = true;
      } else {
        if (defaultAdmin.username !== 'Admin') {
          defaultAdmin.username = 'Admin';
          changed = true;
        }
        if (defaultAdmin.defaultPassword !== 'Admin123') {
          defaultAdmin.defaultPassword = 'Admin123';
          if (defaultAdmin.password === 'admin123' || defaultAdmin.password === 'Admin@123' || !defaultAdmin.password) {
            defaultAdmin.password = 'Admin123';
          }
          changed = true;
        }
        if (!defaultAdmin.lockedUsername) {
          defaultAdmin.lockedUsername = true;
          changed = true;
        }
      }

      (db.staff || []).forEach((st, idx) => {
        const uname = makeStaffUsername(st.name);
        const existing = db.authAccounts.find(a => a.refId === `STF-${String(idx + 1).padStart(3, '0')}` || a.username.toLowerCase() === uname.toLowerCase());
        if (!existing) {
          db.authAccounts.push({
            id: `acct-staff-${st.id}`,
            username: uname,
            password: uname,
            defaultPassword: uname,
            fullName: st.name,
            role: st.role || 'Subject Teacher',
            accountType: 'staff',
            email: st.email || `${uname.toLowerCase()}@ecoleplus.ke`,
            phone: st.phone || `+254 720 111 00${idx + 1}`,
            refId: `STF-${String(idx + 1).padStart(3, '0')}`,
            assignment: st.role === 'Class Teacher'
              ? (st.classStream || 'Assigned Stream')

    function computePlanLiveStatus(plan) {
      const lessons = plan.lessons || [];
      if (lessons.some(l => l.status === 'Ongoing')) return 'Ongoing';
      if (lessons.length > 0 && lessons.every(l => l.status === 'Finished')) return 'Finished';
      if (lessons.some(l => l.status === 'Finished')) return 'Ongoing';
      return 'Not Started';
    }

    function cbcRubricLevel(score) {
      const n = Number(score || 0);
      if (n >= 75) return { code: 'EE', label: 'Exceeding Expectations' };
      if (n >= 55) return { code: 'ME', label: 'Meeting Expectations' };
      if (n >= 40) return { code: 'AE', label: 'Approaching Expectations' };
      return { code: 'BE', label: 'Below Expectations' };
    }

    function attachEvents() {
      document.addEventListener('click', (e) => {
        const closeBtn = e.target.closest('[data-close]');
        if (closeBtn) {
          closeModal();
          return;
        }
        if (e.target.id === 'modalBackdrop') {
          closeModal();
          return;
        }

        if (e.target.id === 'toggleLoginPasswordBtn') {
          loginShowPassword = !loginShowPassword;
          render();
          return;
        }

        if (e.target.id === 'quickLoginStudentBtn') {
          loginPrefillUsername = 'Awanjiku';
          loginPrefillPassword = 'RVA001';
          render();
          showToast('Filled parent/pupil login (Awanjiku / RVA001). Click LOGIN to enter.');
          return;
        }

        if (e.target.id === 'quickLoginStaffBtn') {
          loginPrefillUsername = 'Jkirua';
          loginPrefillPassword = 'Jkirua';
          render();
          showToast('Filled staff credentials (Jkirua / Jkirua) or use Admin / Admin123. Click LOGIN to enter.');
          return;
        }

        if (e.target.closest('#openForgotPasswordHelpBtn, #loginNeedHelpBtn')) {
          openModal('Password Recovery & Sign-In Help', `
            <div style="font-size:13px;line-height:1.65;color:#334155">
              <p style="margin-top:0">For security, forgotten passwords are reset back to the account default by an <b>Admin</b>:</p>
              <ul style="margin:8px 0 12px 18px;padding:0">
                <li><b>Admin Account:</b> Username <code>Admin</code>, Password <code>Admin123</code>.</li>
                <li><b>Staff Accounts:</b> Username and default password use <code>FirstInitial+Surname</code> (e.g., <b>Jane Kirua</b> &rarr; <code>Jkirua</code>).</li>
                <li><b>Parent / Pupil Accounts:</b> Username is student name and default password is the Admission No (e.g., <code>Awanjiku</code> / <code>RVA001</code>).</li>
              </ul>
              <div class="muted" style="font-size:12px">Tip: Use <b>Login as Student / Parent</b> or <b>Login as Staff</b> on the sign-in screen to populate sample credentials.</div>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn primary" data-close>Got It</button>
            </div>`);
          return;
        }

        if (e.target.id === 'loginPrivacyLink') {
          e.preventDefault();
          openModal('Privacy & Data Protection Notice', `
            <p style="font-size:13px;line-height:1.6;color:#334155;margin-top:0">
              Learner, parent, and staff records on <strong>${esc(db.schoolName)}</strong> are managed under role-based access controls and official school approval workflows.
            </p>
            <div class="modal-actions">
              <button type="button" class="btn primary" data-close>Close</button>
            </div>`);
          return;
        }

        if (e.target.id === 'logoutPortalBtn') {
          loggedInUser = null;
          bellOpen = false;
          mobileNavOpen = false;
          render();
          showToast('Signed out of portal.');
          return;
        }

        if (e.target.id === 'mobileMenuToggle') {
          mobileNavOpen = !mobileNavOpen;
          render();
          return;
        }

        const navBtn = e.target.closest('[data-nav]');
        if (navBtn) {
          activeTab = navBtn.getAttribute('data-nav');
          mobileNavOpen = false;
          bellOpen = false;
          render();
          return;
        }

        if (e.target.closest('#bellToggleBtn')) {
          bellOpen = !bellOpen;
          render();
          return;
        }

        if (!e.target.closest('.bell-wrap') && bellOpen) {
          bellOpen = false;
          render();
        }

        if (e.target.id === 'markAllBellReadBtn' || e.target.id === 'markAllNotifsReadPageBtn') {
          (db.notifications || []).forEach(n => { n.read = true; });
          saveDB();
          bellOpen = false;
          render();
          showToast('All notifications marked as read.');
          return;
        }

        const openNotifBtn = e.target.closest('[data-open-notif]');
        if (openNotifBtn) {
          const id = openNotifBtn.getAttribute('data-open-notif');
          const n = (db.notifications || []).find(item => item.id === id);
          if (n) n.read = true;
          saveDB();
          bellOpen = false;
          activeTab = 'notifications';
          render();
          return;
        }

        const toggleNotifReadBtn = e.target.closest('[data-toggle-notif-read]');
        if (toggleNotifReadBtn) {
          const id = toggleNotifReadBtn.getAttribute('data-toggle-notif-read');
          const n = (db.notifications || []).find(item => item.id === id);
          if (n) {
            n.read = !n.read;
            saveDB();
            render();
          }
          return;
        }

        // Headteacher inline Class Teacher update
        const inlineCtBtn = e.target.closest('[data-save-inline-ct]');
        if (inlineCtBtn) {
          const stream = inlineCtBtn.getAttribute('data-save-inline-ct');
          const sel = document.querySelector(`[data-inline-ct-stream="${stream}"]`);
          if (sel) {
            db.classTeacherMap[stream] = sel.value;
            saveDB();
            render();
            showToast(`Assigned ${sel.value} as Class Teacher for ${stream}.`);
          }
          return;
        }

        // Academic Master edit subject allocation modal
        const editAllocBtn = e.target.closest('[data-edit-alloc]');
        if (editAllocBtn) {
          const id = editAllocBtn.getAttribute('data-edit-alloc');
          const alloc = (db.subjectAllocations || []).find(a => a.id === id);
          if (alloc) {
            openModal(`Edit Subject Allocation — ${alloc.subject}`, `
              <form id="editAllocModalForm" data-alloc-id="${esc(alloc.id)}">
                <div class="field" style="margin-bottom:10px">
                  <label>Subject Teacher</label>
                  <input type="text" name="teacher" value="${esc(alloc.teacher)}" required />
                </div>
                <div class="field">
                  <label>Assigned Classes (comma separated)</label>
                  <input type="text" name="classes" value="${esc((alloc.classes || []).join(', '))}" required />
                </div>
                <div class="modal-actions">
                  <button type="button" class="btn" data-close>Cancel</button>
                  <button type="submit" class="btn primary">Save Changes</button>
                </div>
              </form>
            `);
          }
          return;
        }

        // Timetable editor toggle
        if (e.target.id === 'toggleUpdateTimetableBtn' || e.target.id === 'cancelUpdateTimetableBtn') {
          editingTimetableOpen = !editingTimetableOpen;
          render();
          return;
        }

        if (e.target.id === 'autoGenerateMasterTtBtn') {
          const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
          const lowerPool = ['English', 'Mathematics', 'Kiswahili', 'Integrated Science', 'Social Studies', 'Creative Arts & Sports', 'CRE'];
          const upperPool = ['Mathematics', 'English', 'Kiswahili', 'Integrated Science', 'Social Studies', 'Agriculture & Nutrition', 'Creative Arts & Sports'];
          ['lowerPrimary', 'upperPrimary'].forEach((sec, sIdx) => {
            const pool = sec === 'lowerPrimary' ? lowerPool : upperPool;
            (db.masterTimetable[sec] || []).forEach((row, rIdx) => {
              if (row.type !== 'lesson') return;
              days.forEach((d, dIdx) => {
                row[d] = pool[(sIdx + rIdx * 2 + dIdx) % pool.length];
              });
            });
          });
          saveDB();
          render();
          showToast('Auto-generated balanced CBC timetable periods.');
          return;
        }

        // Lesson plans subtabs & actions
        const lpSubBtn = e.target.closest('[data-lp-subtab]');
        if (lpSubBtn) {
          lessonPlansSubtab = lpSubBtn.getAttribute('data-lp-subtab');
          render();
          return;
        }

        if (e.target.id === 'openCreateWlpBtn') {

              db.staff.push({
                id: `st-${Date.now()}`,
                name: fullName,
                role,
                category: 'Teaching',
                department: role,
                subject: role === 'Subject Teacher' ? 'Mathematics' : '',
                classes: [],
                classStream: '',
                phone: String(fd.get('phone') || '').trim(),
                email: String(fd.get('email') || '').trim(),
                status: enabled ? 'Active' : 'Disabled'
              });
            }
          }

          saveDB();
          render();
          showToast(`Created ${role} account: username ${finalUsername} (locked), default password ${defaultPass}.`);
          return;
        }

        if (e.target.id === 'editUserRoleModalForm') {
          e.preventDefault();
          const uId = e.target.getAttribute('data-user-id');
          const u = (db.authAccounts || []).find(a => a.id === uId);
          if (u) {
            const fd = new FormData(e.target);
            u.role = String(fd.get('role') || u.role);
            u.permissions = ALL_PERMISSIONS.filter(p => fd.get(`perm_${p}`) === 'on');
            saveDB();
            closeModal();
            render();
            showToast(`Updated role & permissions for ${u.username}.`);
          }
          return;
        }

        if (e.target.id === 'schoolSettingsForm') {
          e.preventDefault();
          const fd = new FormData(e.target);
          db.schoolName = String(fd.get('schoolName') || db.schoolName).trim();
          db.schoolMotto = String(fd.get('schoolMotto') || db.schoolMotto).trim();
          db.stampDate = String(fd.get('stampDate') || STAMP_DATE).trim();
          saveDB();
          render();
          showToast('Saved school settings and red-ink stamp date.');
          return;
        }

        if (e.target.id === 'myProfilePasswordForm') {
          e.preventDefault();
          const fd = new FormData(e.target);
          const cur = String(fd.get('currentPassword') || '');
          const nextP = String(fd.get('newPassword') || '');
          const confP = String(fd.get('confirmPassword') || '');
          const prof = getActiveUserProfile();
          if (!prof) return;
          if (prof.password !== cur) {
            showToast('Current password is incorrect.');
            return;
          }
          if (nextP !== confP) {
            showToast('New password and confirmation do not match.');
            return;
          }
          prof.password = nextP;
          saveDB();
          render();
          showToast('Password updated successfully (username remains unchanged).');
          return;
        }

        if (e.target.id === 'notificationsChatForm') {
          e.preventDefault();
          const fd = new FormData(e.target);
          const recipient = String(fd.get('recipient') || 'All Users');
          const text = String(fd.get('message') || '').trim();
          if (!text) return;
          const senderName = getActiveUserProfile()?.fullName || db.activeRole;
          db.chatMessages.push({
            id: `c-${Date.now()}`,
            sender: `${senderName} (${db.activeRole})`,
            recipient,
            text,
            time: getCurrentTimeLabel()
          });
          saveDB();
          render();
          showToast(`Sent chat to ${recipient}.`);
          return;
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      ensureAuthAccounts();
      attachEvents();
      render();
    });
  </script>

    // Ecole+ Firebase connection (single-file setup)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js";
    import {
      getDatabase, ref, onValue, set
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCXwd4D1bDx4bwM5f6sbu0AQo8XzOTQgE",
      authDomain: "ecoleplus-45c85.firebaseapp.com",
      databaseURL: "https://ecoleplus-45c85-default-rtdb.firebaseio.com",
      projectId: "ecoleplus-45c85",
      storageBucket: "ecoleplus-45c85.firebasestorage.app",
      messagingSenderId: "378904106865",
      appId: "1:378904106865:web:0682d4df79275dd4cbc8d0",
      measurementId: "G-VTRVBJMYPM"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    try { getAnalytics(firebaseApp); } catch (error) {
      console.warn("Firebase Analytics is unavailable in this browser:", error);
    }

    const database = getDatabase(firebaseApp);
    const schoolDataRef = ref(database, "ecolePlus/schoolData");
    let applyingCloudData = false;
    let lastCloudJson = "";

    // Called by the existing Ecole+ saveDB() function.
    window.__ecoleFirebaseSave = async function (schoolData) {
      if (applyingCloudData) return;
      try {
        const payload = JSON.stringify(schoolData);
        lastCloudJson = payload;
        await set(schoolDataRef, schoolData);
        window.dispatchEvent(new CustomEvent("ecole-firebase-status", {
          detail: { connected: true, message: "Changes saved to Firebase." }
        }));
      } catch (error) {
        console.error("Firebase save failed:", error);
        window.dispatchEvent(new CustomEvent("ecole-firebase-status", {
          detail: { connected: false, message: "Firebase save failed. Check Database rules and connection." }
        }));
      }
    };

    // Keep the local browser copy and Firebase copy in sync.
    onValue(schoolDataRef, (snapshot) => {
      const cloudData = snapshot.val();
      if (cloudData && typeof cloudData === "object") {
        const cloudJson = JSON.stringify(cloudData);
        if (cloudJson !== lastCloudJson) {
          applyingCloudData = true;
          lastCloudJson = cloudJson;
          try {
            window.__ecoleApplyFirebaseData(cloudData);
          } finally {
            applyingCloudData = false;
          }
        }
      } else {
        // First run: seed the Firebase database from this browser's existing Ecole+ data.
        window.__ecoleFirebaseSave(window.__ecoleGetLocalData());
      }
      window.dispatchEvent(new CustomEvent("ecole-firebase-status", {
        detail: { connected: true, message: "Connected to Firebase Realtime Database." }
      }));
    }, (error) => {
      console.error("Firebase connection failed:", error);
      window.dispatchEvent(new CustomEvent("ecole-firebase-status", {
        detail: { connected: false, message: "Could not read Firebase. Check Realtime Database setup and rules." }
      }));
    });
  </script>
