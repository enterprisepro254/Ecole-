<style>

function generate540Students() {
  const firstNames = ['Amani', 'Brian', 'Chloe', 'Daniel', 'Esther', 'Faith', 'George', 'Hannah', 'Ian', 'Joy', 'Kevin', 'Lilian', 'Mark', 'Neema', 'Oscar', 'Purity', 'Quincy', 'Ruth', 'Samuel', 'Talia'];

  const counts = { PG: 60, PP1: 60, PP2: 60, 'Grade 1': 60, 'Grade 2': 60, 'Grade 3': 60, 'Grade 4': 60, 'Grade 5': 60, 'Grade 6': 60 };
  const list = [];
  let seq = 1001;
  CLASSES.forEach((cls, cIdx) => {
    const total = counts[cls] || 75;
    for (let i = 0; i < total; i++) {
      const streamSide = i % 2 === 0 ? 'East' : 'West';
      const fn = firstNames[(seq + i + cIdx) % firstNames.length];
      const ln = lastNames[(seq * 3 + i) % lastNames.length];
      const termFee = cls === 'PG' ? 14500 : (cls.startsWith('PP') ? 16500 : 19500);
      const paid = i % 5 === 0 ? termFee : (i % 3 === 0 ? Math.round(termFee * 0.7) : Math.round(termFee * 0.5));
      list.push({
        id: 'STU-' + seq,
        adm: 'DUA/' + seq,
        name: `${fn} ${ln}`,
        gender: i % 2 === 0 ? 'Female' : 'Male',
        className: cls,
        stream: `${cls} ${streamSide}`,
        guardian: `Parent of ${fn} ${ln}`,
        phone: `07${String(10 + (seq % 89)).padStart(2, '0')} ${String(100 + (seq % 899)).padStart(3, '0')} ${String(100 + ((seq * 7) % 899)).padStart(3, '0')}`,
        termFee,
        paid,
        balance: Math.max(0, termFee - paid),
        transferState: 'Received',
        targetClass: '',
        targetStream: '',
        transferNote: ''
      });
      seq++;
    }
  });
  return list;
}

function cloneDefault() {
  return JSON.parse(JSON.stringify(DEFAULT_DB));
}

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return cloneDefault();
    const parsed = JSON.parse(raw);
    const merged = {
      ...cloneDefault(),
      ...parsed,
      school: {
        ...DEFAULT_DB.school,
        ...(parsed.school || {}),
        signatures: {
          ...DEFAULT_DB.school.signatures,
          ...((parsed.school && parsed.school.signatures) || {})
        }
      },
      feeStructure: { ...DEFAULT_DB.feeStructure, ...(parsed.feeStructure || {}) }
    };
    if (!Array.isArray(merged.students) || merged.students.length !== 540) {
      merged.students = generate540Students();
    }
    if (!Array.isArray(merged.users) || !merged.users.length) {
      merged.users = INITIAL_USERS;
    }
    if (!Array.isArray(merged.weeklyLessonPlans) || !merged.weeklyLessonPlans.length) {
      merged.weeklyLessonPlans = DEFAULT_DB.weeklyLessonPlans;
    }
    if (!Array.isArray(merged.homework)) {
      merged.homework = DEFAULT_DB.homework;
    }
    if (!Array.isArray(merged.notifications)) {
      merged.notifications = DEFAULT_DB.notifications;
    }
    if (!Array.isArray(merged.chats) || !merged.chats.length) {
      merged.chats = DEFAULT_DB.chats;
    }
    merged.cbcTimetable = {
      prePrimary: {
        ...DEFAULT_CBC_TIERS.prePrimary,
        ...((parsed.cbcTimetable && parsed.cbcTimetable.prePrimary) || {}),
        slots: {
          ...DEFAULT_CBC_TIERS.prePrimary.slots,
          ...((parsed.cbcTimetable && parsed.cbcTimetable.prePrimary && parsed.cbcTimetable.prePrimary.slots) || {})
        }
      },
      lowerPrimary: {
        ...DEFAULT_CBC_TIERS.lowerPrimary,
        ...((parsed.cbcTimetable && parsed.cbcTimetable.lowerPrimary) || {}),
        slots: {
          ...DEFAULT_CBC_TIERS.lowerPrimary.slots,
          ...((parsed.cbcTimetable && parsed.cbcTimetable.lowerPrimary && parsed.cbcTimetable.lowerPrimary.slots) || {})
        }
      },
      upperPrimary: {
        ...DEFAULT_CBC_TIERS.upperPrimary,
        ...((parsed.cbcTimetable && parsed.cbcTimetable.upperPrimary) || {}),
        slots: {
          ...DEFAULT_CBC_TIERS.upperPrimary.slots,
          ...((parsed.cbcTimetable && parsed.cbcTimetable.upperPrimary && parsed.cbcTimetable.upperPrimary.slots) || {})
        }
      }
    };
    return merged;
  } catch (err) {
    return cloneDefault();
  }

// Dynamic Teacher Profile Getters (including newly created Admin users)
function getAllClassTeachers() {
  const dynamic = (db.users || [])
    .filter(u => u.role === 'Class Teacher' && u.status === 'Active' && !CLASS_TEACHER_PROFILES.some(p => p.name === u.name))
    .map(u => {
      const streamMatch = CLASSES.find(c => (u.assignment || '').includes(c)) || 'Grade 4';
      const streamName = (u.assignment || '').includes('West') ? `${streamMatch} West` : `${streamMatch} East`;
      return {
        id: 'CT-' + u.id,
        name: u.name,
        className: streamMatch,
        stream: streamName,
        officeTitle: `CLASS TEACHER · ${streamName.toUpperCase()}`
      };
    });
  return [...CLASS_TEACHER_PROFILES, ...dynamic];
}

function getAllSubjectTeachers() {
  const dynamic = (db.users || [])
    .filter(u => u.role === 'Subject Teacher' && u.status === 'Active' && !SUBJECT_TEACHER_PROFILES.some(p => p.name === u.name))
    .map(u => {
      const subs = EXAM_SUBJECTS.filter(s => (u.assignment || '').toLowerCase().includes(s.toLowerCase()));
      return {
        id: 'ST-' + u.id,
        name: u.name,
        subjects: subs.length ? subs : ['Mathematics', 'English'],
        classes: ['Grade 4', 'Grade 5', 'Grade 6'],
        officeTitle: `SUBJECT TEACHER · ${(subs[0] || 'GENERAL').toUpperCase()}`
      };
    });
  return [...SUBJECT_TEACHER_PROFILES, ...dynamic];
}

function getActiveClassTeacher() {
  const all = getAllClassTeachers();
  return all.find(t => t.id === activeClassTeacherId) || all[0];
}

function getActiveSubjectTeacher() {
  const all = getAllSubjectTeachers();
  return all.find(t => t.id === activeSubjectTeacherId) || all[0];
}

function getRoleOfficeTitle() {
  if (activeRole === 'Class Teacher') return getActiveClassTeacher().officeTitle;
  if (activeRole === 'Subject Teacher') return getActiveSubjectTeacher().officeTitle;
  if (activeRole === 'Headteacher') return 'OFFICE OF THE HEADTEACHER';
  if (activeRole === 'Academic Master') return 'OFFICE OF ACADEMIC MASTER';
  if (activeRole === 'Accountant') return 'SCHOOL BURSAR · ACCOUNTS';
  if (activeRole === 'Parent') return 'PARENT PORTAL COPY';
  return 'OFFICE OF THE ADMINISTRATOR';
}

function hasPermission(permKey) {
  if (activeRole === 'Admin') return true;
  const matchedUser = (db.users || []).find(u => u.role === activeRole && u.status === 'Active');
  if (matchedUser && Array.isArray(matchedUser.permissions)) {
    return matchedUser.permissions.includes(permKey);
  }
  const fallback = ROLE_DEFAULT_PERMISSIONS[activeRole] || [];
  return fallback.includes(permKey);
}

function getAllowedPagesForRole(role) {
  const matchedUser = (db.users || []).find(u => u.role === role && u.status === 'Active');
  if (matchedUser && Array.isArray(matchedUser.tabs) && matchedUser.tabs.length > 0) {
    return matchedUser.tabs;
  }
  if (ROLE_TAB_DEFAULTS[role]) {

  return ['dashboard', 'notices'];
}

      </button>`;
    }).join('');

  document.querySelectorAll('#roleSwitcher .role-pill').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.role === activeRole);
  });

  const topSchoolEl = $('#topSchoolTitle');
  if (topSchoolEl) topSchoolEl.textContent = db.school.name || 'Dandora Unity Academy & CBC School';

      badgeEl.textContent = 'E+';

  }
  const sub = $('#topRoleSubtitle');
  if (sub) {
    let detail = activeRole;
    if (activeRole === 'Class Teacher') detail = `Class Teacher · ${getActiveClassTeacher().name} (${getActiveClassTeacher().stream})`;
    if (activeRole === 'Subject Teacher') detail = `Subject Teacher · ${getActiveSubjectTeacher().name}`;
    sub.innerHTML = `Active Role: <b>${esc(detail)}</b> · <span style="color:#dc2626;font-weight:700">${CURRENT_DATE_LABEL}</span>`;
  }

  const root = $('#pageRoot');
  if (currentPage === 'dashboard') root.innerHTML = renderDashboard();
  else if (currentPage === 'users') root.innerHTML = renderUsersPage();
  else if (currentPage === 'fees') root.innerHTML = renderFeesPage();
  else if (currentPage === 'feestructure') root.innerHTML = renderFeeStructureStandalone();
  else if (currentPage === 'lessonplans') root.innerHTML = renderLessonPlansPage();
  else if (currentPage === 'homework') root.innerHTML = renderHomeworkPage();
  else if (currentPage === 'timetable') root.innerHTML = renderTimetablePage();
  else if (currentPage === 'exams') root.innerHTML = renderExamManagementPage(false);
  else if (currentPage === 'reports') root.innerHTML = renderExamManagementPage(true);
  else if (currentPage === 'students') root.innerHTML = renderStudentsPage();
  else if (currentPage === 'staff') root.innerHTML = renderStaffPage();
  else if (currentPage === 'notices') root.innerHTML = renderNotificationsAndChatsPage();
  else if (currentPage === 'settings') root.innerHTML = renderSettingsPage();
  else root.innerHTML = renderDashboard();

  renderBellPopover();
  const pop = $('#bellPopover');
  if (pop) pop.classList.toggle('open', bellOpen);
}

function getTierKeyForClass(className) {
  if (['PG', 'PP1', 'PP2'].includes(className)) return 'prePrimary';
  if (['Grade 1', 'Grade 2', 'Grade 3'].includes(className)) return 'lowerPrimary';
  return 'upperPrimary';
}

function getCbcPerformanceLevel(score) {
  const n = Number(score || 0);
  if (n >= 80) return { code: 'EE', label: 'Exceeding Expectation', cls: '' };
  if (n >= 60) return { code: 'ME', label: 'Meeting Expectation', cls: '' };
  if (n >= 40) return { code: 'AE', label: 'Approaching Expectation', cls: 'warn' };
  return { code: 'BE', label: 'Below Expectation', cls: 'red' };
}

document.addEventListener('click', e => {
  if (e.target.closest('#openPortalLoginBtn')) {
    const gate = $('#portalLoginGate');
    if (gate) {
      $('#loginUsernameInput').value = '';
      $('#loginPasswordInput').value = '';
      $('#portalLoginMsg').textContent = '';
      gate.style.display = 'flex';
    }
    return;
  }

  if (e.target.closest('#clearLoginFieldsBtn')) {
    $('#loginUsernameInput').value = '';
    $('#loginPasswordInput').value = '';
    $('#loginRoleSelect').value = '';
    $('#portalLoginMsg').textContent = '';
    return;
  }

  // Close modal
  if (e.target.closest('[data-close]') || e.target.id === 'modalBackdrop') {
    closeModal();
    return;
  }

  // Mobile sidebar drawer
  if (e.target.closest('#mobileMenuBtn')) {
    $('#sidebar').classList.toggle('open');
    $('#drawerScrim').classList.toggle('open');
    return;
  }
  if (e.target.id === 'drawerScrim') {
    $('#sidebar').classList.remove('open');
    $('#drawerScrim').classList.remove('open');
    return;
  }

  // Notification Bell popover
  if (e.target.closest('#notificationBellBtn')) {
    bellOpen = !bellOpen;
    const pop = $('#bellPopover');
    if (pop) pop.classList.toggle('open', bellOpen);
    return;
  }
  if (e.target.closest('#bellMarkAllReadBtn')) {
    db.notifications.forEach(n => { n.read = true; });
    saveDB();
    renderBellPopover();
    return;
  }
  const toggleNotifBtn = e.target.closest('[data-toggle-notif-read]');
  if (toggleNotifBtn) {
    const item = db.notifications.find(n => n.id === toggleNotifBtn.dataset.toggleNotifRead);
    if (item) {
      item.read = !item.read;

        const val = submittedVal !== undefined ? Number(submittedVal) : (68 + ((i * 6 + idx * 3) % 27));
        sum += val;
        return `<td style="text-align:right">${val}</td>`;
      }).join('');
      const avg = Math.round(sum / EXAM_SUBJECTS.length);
      const lvl = getCbcPerformanceLevel(avg);
      return `<tr><td><b>${esc(st.adm)}</b></td><td>${esc(st.name)}</td><td>${esc(st.stream)}</td>${cells}<td style="text-align:right"><b>${sum}</b></td><td style="text-align:right"><b>${avg}%</b></td><td><span class="pill">${lvl.code}</span></td></tr>`;

// Change & Input events
document.addEventListener('change', e => {
  if (e.target.id === 'createUserRoleSelect') {
    const r = e.target.value;
    const defActions = ROLE_DEFAULT_PERMISSIONS[r] || [];
    const defTabs = ROLE_TAB_DEFAULTS[r] || [];
    document.querySelectorAll('#createUserActionPermsGrid input[type="checkbox"]').forEach(cb => {
      cb.checked = defActions.includes(cb.value);
    });
    document.querySelectorAll('#createUserTabsGrid input[type="checkbox"]').forEach(cb => {
      cb.checked = defTabs.includes(cb.value);
    });
  }

  if (e.target.id === 'switchClassTeacherSelect') {
    activeClassTeacherId = e.target.value;
    const ct = getActiveClassTeacher();
    classTeacherActiveGrade = ct.className;
    examSelectedGrade = ct.className;
    render();
    showToast(`Switched Class Teacher to ${ct.name} (${ct.stream}).`);
  }

  if (e.target.id === 'switchSubjectTeacherSelect') {
    activeSubjectTeacherId = e.target.value;
    const st = getActiveSubjectTeacher();
    examSelectedGrade = st.classes[0] || 'Grade 4';
    scoresheetEntryScheduleId = null;
    lpCreatingMode = false;
    lpEditingPlanId = null;
    lpSelectedPlanId = null;
    render();
    showToast(`Switched Subject Teacher to ${st.name} (${st.subjects.join(', ')}).`);
  }

  if (e.target.id === 'lpDayFilter') { lpFilters.day = e.target.value; render(); }
  if (e.target.id === 'lpGradeFilter') { lpFilters.gradeClass = e.target.value; render(); }
  if (e.target.id === 'lpSubjectFilter') { lpFilters.subject = e.target.value; render(); }
  if (e.target.id === 'lpTeacherFilter') { lpFilters.teacher = e.target.value; render(); }

  if (e.target.id === 'userRoleFilterSelect') { userRoleFilter = e.target.value; render(); }
  if (e.target.id === 'studentClassFilter') { studentFilters.className = e.target.value; render(); }
  if (e.target.id === 'feeClassFilter') { feeFilters.className = e.target.value; render(); }
  if (e.target.id === 'ttStreamSelect') { ttStreamFilter = e.target.value; render(); }
  if (e.target.id === 'examGradeFilter') { examSelectedGrade = e.target.value; render(); }

  if (e.target.id === 'chatRecipientTypeSelect') {
    const field = $('#specificUserField');
    if (field) field.style.display = e.target.value === 'Specific User' ? 'flex' : 'none';
  }

  if (e.target.id === 'homeworkFileInput') {
    const file = e.target.files && e.target.files[0];
    if (file) {

function parseCsvRows(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const splitLine = line => {
    const out = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        out.push(cur.trim());
        cur = '';
      } else {
        cur += ch;
      }
    }
    out.push(cur.trim());
    return out;
  };
  const headers = splitLine(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
  return lines.slice(1).map(line => {
    const vals = splitLine(line);
    const row = {};
    headers.forEach((h, idx) => { row[h] = vals[idx] !== undefined ? vals[idx] : ''; });
    return row;
  });
}

function triggerCsvDownload(filename, content) {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

    const adm = e.target.dataset.adm;
    const fd = new FormData(e.target);
    const st = db.students.find(s => s.adm === adm);
    if (st) {
      const targetStream = String(fd.get('targetStream') || st.stream);
      st.targetStream = targetStream;
      st.targetClass = st.className;
      st.transferNote = String(fd.get('transferNote') || '').trim();
      st.transferState = 'Pending Stream Receipt';
      saveDB();
      closeModal();
      render();
      showToast(`Initiated transfer of ${st.name} to ${targetStream} (same class ${st.className}).`);
    }
  }

  if (e.target.id === 'updateStudentDetailsForm') {
    e.preventDefault();
    const adm = e.target.dataset.adm;
    const fd = new FormData(e.target);
    const st = db.students.find(s => s.adm === adm);
    if (st) {
      st.name = String(fd.get('name') || st.name).trim();
      st.gender = String(fd.get('gender') || st.gender);
      st.guardian = String(fd.get('guardian') || st.guardian).trim();
      st.phone = String(fd.get('phone') || st.phone).trim();
      saveDB();
      closeModal();
      render();
      showToast(`Updated details for ${st.name} (${st.adm}).`);
    }
  }

  if (e.target.id === 'updateStaffDetailsForm') {
    e.preventDefault();
    const staffId = e.target.dataset.staffId;
    const fd = new FormData(e.target);
    const staffObj = db.staff.find(s => s.id === staffId);
    if (staffObj) {
      staffObj.name = String(fd.get('name') || staffObj.name).trim();
      staffObj.category = String(fd.get('category') || staffObj.category);
      staffObj.role = String(fd.get('role') || staffObj.role).trim();
      staffObj.department = String(fd.get('department') || staffObj.department).trim();
      staffObj.phone = String(fd.get('phone') || staffObj.phone).trim();
      staffObj.status = String(fd.get('status') || staffObj.status);
      saveDB();
      closeModal();
      render();
      showToast(`Updated staff details for ${staffObj.name}.`);
    }
  }

  if (e.target.id === 'schoolSettingsForm') {
    e.preventDefault();
    const fd = new FormData(e.target);
    db.school.name = String(fd.get('name') || db.school.name).trim();
    db.school.poBox = String(fd.get('poBox') || db.school.poBox).trim();
    db.school.phone = String(fd.get('phone') || db.school.phone).trim();
    db.school.email = String(fd.get('email') || db.school.email).trim();
    db.school.term = String(fd.get('term') || db.school.term);
    db.school.stampLine1 = String(fd.get('stampLine1') || db.school.stampLine1).trim();
    saveDB();
    render();
    showToast('School settings, logo, and rubber stamp updated.');
  }
});

function initSignatureCanvas() {
  const canvas = $('#sigPadCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#0F4C3A';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  let drawing = false;

  const getPos = ev => {
    const rect = canvas.getBoundingClientRect();
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  };

  const start = ev => {
    drawing = true;
    const p = getPos(ev);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };
  const move = ev => {
    if (!drawing) return;
    ev.preventDefault();
    const p = getPos(ev);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  const end = () => { drawing = false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

// Immediate initial render
render();
</script>
